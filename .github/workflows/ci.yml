
name: Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -v

  container-security:
    name: Build and Scan Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.distroless \
            -t sre-platform-api:ci \
            .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            sre-platform-api:ci
  publish-ecr:
    name: Publish Image to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - test
      - container-security

    outputs:
      image_repository: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}
      image_tag: ${{ github.sha }}

    # Enable only after AWS infrastructure is provisioned.
    if: ${{ false }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.distroless \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  update-gitops:
    name: Update GitOps Image Tag
    runs-on: ubuntu-latest
    needs: publish-ecr

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-ecr.result == 'success' }}

    permissions:
      contents: read

    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: Thompson-Cloud
          repositories: sre-platform-gitops

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: Thompson-Cloud/sre-platform-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Update dev image tag
        env:
          IMAGE_TAG: ${{ needs.publish-ecr.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.publish-ecr.outputs.image_repository }}
        run: |
          cd gitops

          python3 - "$IMAGE_REPOSITORY" "$IMAGE_TAG" <<'PY'
          import pathlib
          import re
          import sys

          repository, tag = sys.argv[1:]

          path = pathlib.Path("apps/sre-api/overlays/dev/kustomization.yaml")
          content = path.read_text()

          name_pattern = r"(?m)^([ \t]*newName:[ \t]*).+$"
          tag_pattern = r"(?m)^([ \t]*newTag:[ \t]*).+$"

          if len(re.findall(name_pattern, content)) != 1:
              raise SystemExit("Expected exactly one newName field")

          if len(re.findall(tag_pattern, content)) != 1:
              raise SystemExit("Expected exactly one newTag field")

          content = re.sub(name_pattern, lambda m: m.group(1) + repository, content)
          content = re.sub(tag_pattern, lambda m: m.group(1) + tag, content)

          path.write_text(content)
          PY

      - name: Commit and push GitOps update
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd gitops

          git config user.name "thompson-sre-gitops-bot[bot]"
          git config user.email "5310179+thompson-sre-gitops-bot[bot]@users.noreply.github.com"

          git add apps/sre-api/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit"
            exit 0
          fi

          git commit -m "chore(gitops): deploy image ${{ needs.publish-ecr.outputs.image_tag }}"

          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)" \
            push origin HEAD:main
